[project]
name = "tiny-mlir"
version = "0.1.0"
description = "A small MLIR compiler for transformer kernels and GPT-2 inference"
authors = [{ name = "Stephen Diehl" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1.2,<3",
  "mlir-python-bindings==22.0.0.2025112901",
  "nvidia-cuda-nvcc-cu12>=12.4,<13 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "safetensors>=0.8,<0.9",
  "huggingface-hub>=1.33,<2",
  "tokenizers>=0.23.2,<0.24",
]

[dependency-groups]
dev = [
  "black>=26,<27",
  "pre-commit>=4,<5",
  "pytest>=9,<10",
  "ruff>=0.15,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tinymlir"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '/(model|dist)/'

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["model", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.uv.sources]
mlir-python-bindings = [
  { url = "https://github.com/makslevental/mlir-wheels/releases/download/latest/mlir_python_bindings-22.0.0.2025112901%2B9bae84b0-cp312-cp312-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
  { url = "https://github.com/makslevental/mlir-wheels/releases/download/latest/mlir_python_bindings-22.0.0.2025112901%2B9bae84b0-cp312-cp312-macosx_11_0_x86_64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'x86_64'" },
  { url = "https://github.com/makslevental/mlir-wheels/releases/download/latest/mlir_python_bindings-22.0.0.2025112901%2Bcuda.9bae84b0-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
  { url = "https://github.com/makslevental/mlir-wheels/releases/download/latest/mlir_python_bindings-22.0.0.2025112901%2B9bae84b0-cp312-cp312-manylinux_2_35_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]

[tool.uv]
environments = [
  "sys_platform == 'darwin' and (platform_machine == 'arm64' or platform_machine == 'x86_64')",
  "sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64')",
]
